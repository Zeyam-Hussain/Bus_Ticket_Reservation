services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-bus_reservation_system}
      POSTGRES_USER: ${DB_USER:-bus_app}
      POSTGRES_PASSWORD: ${DB_PASS:?Set DB_PASS in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: bus-reservation-system:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      ai_service:
        condition: service_started
    ports:
      - "127.0.0.1:8080:80"
    environment:
      APP_ENV: ${APP_ENV:-development}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-http://localhost:8080}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-bus_reservation_system}
      DB_USER: ${DB_USER:-bus_app}
      DB_PASS: ${DB_PASS:?Set DB_PASS in .env}
      DB_SSL: "false"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      ADMIN_CREATION_SECRET: ${ADMIN_CREATION_SECRET:?Set ADMIN_CREATION_SECRET in .env}
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST in .env}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_SECURE: ${SMTP_SECURE:-tls}
      SMTP_USER: ${SMTP_USER:?Set SMTP_USER in .env}
      SMTP_PASS: ${SMTP_PASS:?Set SMTP_PASS in .env}
      SMTP_FROM: ${SMTP_FROM:?Set SMTP_FROM in .env}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Bus Reservation System}
      API_BASE_URL: http://localhost:8080/api
      AI_SERVICE_URL: http://ai_service:8000
      AI_SERVICE_SECRET: ${AI_SERVICE_SECRET:?Set AI_SERVICE_SECRET in .env}

  ai_service:
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      AI_SERVICE_SECRET: ${AI_SERVICE_SECRET:?Set AI_SERVICE_SECRET in .env}
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

volumes:
  postgres_data:
